name: Docs

# Builds the MkDocs site from docs/ and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# GitHub's free plan has no Pages for private repositories, so while the repository is private the
# site is only built (which still catches broken links and references) and the deploy is skipped.

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "src/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
